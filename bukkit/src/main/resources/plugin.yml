name: OneClientServerAPI
version: '${version}'
main: org.polyfrost.oneclient.bukkit.OneClientBukkitPlugin
api-version: '1.13'
description: Server-side API for detecting and integrating with OneClient players.
authors: [Polyfrost]
website: https://polyfrost.org

commands:
  oneclient:
    description: Lists OneClient players or reloads the config.
    usage: /<command> [list|reload]
    permission: oneclient.admin

permissions:
  oneclient.admin:
    description: Allows /oneclient list and /oneclient reload.
    default: op
